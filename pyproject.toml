[project]
name = "aai-501-final-team-project-group2"
version = "0.1.0"
description = "Phishing URL detection on the PhiUSIIL dataset — AAI-501 Final Team Project (Group 2)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "rapidfuzz>=3.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "seaborn>=0.13.2",
    "tldextract>=5.3.1",
    "torch>=2.13.0",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.3.0",
]
[tool.ruff]
line-length = 79
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["E501"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "nbstripout>=0.9.1",
    "ruff>=0.15.21",
]
